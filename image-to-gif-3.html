<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Images to GIF</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel-border:#262b36;
    --text:#e8eaf0;
    --muted:#9aa1b1;
    --accent:#6c8cff;
    --accent-hover:#8aa3ff;
    --danger:#ff6c6c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px;
  }
  h1{
    font-size:20px;
    margin:0 0 4px;
  }
  .sub{
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:18px;
    margin-bottom:16px;
  }
  .drop{
    border:2px dashed var(--panel-border);
    border-radius:10px;
    padding:28px;
    text-align:center;
    color:var(--muted);
    cursor:pointer;
    transition: border-color .15s, background .15s;
  }
  .drop.dragover{
    border-color:var(--accent);
    background:rgba(108,140,255,0.06);
  }
  .drop input{display:none;}
  .row{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  label.field{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-size:13px;
    color:var(--muted);
  }
  input[type=number]{
    background:#0d0f14;
    border:1px solid var(--panel-border);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    width:90px;
    font-size:14px;
  }
  input[type=range]{
    accent-color:var(--accent);
  }
  select{
    background:#0d0f14;
    border:1px solid var(--panel-border);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-size:14px;
  }
  button{
    background:var(--accent);
    color:#0b0d12;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition: background .15s;
  }
  button:hover{background:var(--accent-hover);}
  button:disabled{
    background:#3a3f4d;
    color:#7a8093;
    cursor:not-allowed;
  }
  button.secondary{
    background:transparent;
    border:1px solid var(--panel-border);
    color:var(--text);
  }
  button.secondary:hover{background:#1f232c;}
  #thumbs{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:16px;
  }
  .thumb{
    position:relative;
    width:96px;
    background:#0d0f14;
    border:1px solid var(--panel-border);
    border-radius:8px;
    overflow:hidden;
    user-select:none;
  }
  .thumb img{
    width:100%;
    height:72px;
    object-fit:cover;
    display:block;
  }
  .thumb .idx{
    position:absolute;
    top:4px;
    left:4px;
    background:rgba(0,0,0,0.6);
    color:#fff;
    font-size:11px;
    padding:1px 6px;
    border-radius:6px;
  }
  .thumb .ctrl{
    display:flex;
    justify-content:space-between;
    padding:4px;
    gap:2px;
  }
  .thumb .ctrl button{
    flex:1;
    padding:3px 0;
    font-size:11px;
    border-radius:5px;
    background:#1f232c;
    color:var(--text);
    font-weight:500;
  }
  .thumb .ctrl button:hover{background:#2a2f3b;}
  .thumb .ctrl button.remove{color:var(--danger);}
  #status{
    font-size:13px;
    color:var(--muted);
    margin-top:10px;
    min-height:18px;
  }
  progress{
    width:100%;
    height:8px;
    accent-color:var(--accent);
    margin-top:8px;
  }
  #result{
    margin-top:16px;
    text-align:center;
  }
  #result img{
    max-width:100%;
    border-radius:8px;
    border:1px solid var(--panel-border);
  }
  #downloadBtn{
    display:inline-block;
    margin-top:12px;
    text-decoration:none;
  }
  .hint{
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
  }
</style>
</head>
<body>

<h1>Images → Animated GIF</h1>
<div class="sub">Upload images, set the order and the delay between frames, then generate a downloadable GIF.</div>

<div class="panel">
  <div class="drop" id="dropZone">
    <div>Click to choose images, or drag & drop them here</div>
    <div class="hint">JPG, PNG, WEBP — any resolution (frames are resized to match the first image)</div>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </div>

  <div id="thumbs"></div>
</div>

<div class="panel">
  <div class="row">
    <label class="field">
      Delay between frames
      <div class="row" style="gap:8px;">
        <input type="number" id="delayNumber" min="0.1" max="10" step="0.1" value="0.5">
        <span style="color:var(--muted); font-size:13px;">seconds</span>
      </div>
    </label>

    <label class="field">
      Quick presets
      <div class="row" style="gap:6px;">
        <button type="button" class="secondary" data-delay="0.1">0.1s</button>
        <button type="button" class="secondary" data-delay="0.5">0.5s</button>
        <button type="button" class="secondary" data-delay="1">1s</button>
        <button type="button" class="secondary" data-delay="2">2s</button>
      </div>
    </label>

    <label class="field">
      Loop
      <select id="loopSelect">
        <option value="0">Loop forever</option>
        <option value="1">Play once</option>
      </select>
    </label>

    <label class="field">
      Output width (px)
      <input type="number" id="widthInput" min="16" max="1600" step="1" placeholder="auto">
    </label>
  </div>

  <div class="row" style="margin-top:16px;">
    <button id="generateBtn" disabled>Generate GIF</button>
    <button class="secondary" id="clearBtn">Clear all</button>
  </div>

  <div id="status"></div>
  <div class="row" id="progressRow" style="display:none; gap:10px; align-items:center;">
    <progress id="progressBar" value="0" max="1" style="flex:1;"></progress>
    <span id="progressPct" style="font-size:13px; color:var(--muted); min-width:36px; text-align:right;">0%</span>
  </div>
</div>

<div class="panel" id="result" style="display:none;">
  <img id="resultImg" alt="Generated GIF preview">
  <div>
    <a id="downloadBtn" href="#" download="animation.gif"><button>Download GIF</button></a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script>
let images = []; // { file, url, imgEl }

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const thumbsEl = document.getElementById('thumbs');
const generateBtn = document.getElementById('generateBtn');
const clearBtn = document.getElementById('clearBtn');
const statusEl = document.getElementById('status');
const progressBar = document.getElementById('progressBar');
const progressRow = document.getElementById('progressRow');
const progressPct = document.getElementById('progressPct');
const resultPanel = document.getElementById('result');
const resultImg = document.getElementById('resultImg');
const downloadBtn = document.getElementById('downloadBtn');
const delayNumber = document.getElementById('delayNumber');
const loopSelect = document.getElementById('loopSelect');
const widthInput = document.getElementById('widthInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => handleFiles(e.target.files));

document.querySelectorAll('[data-delay]').forEach(btn => {
  btn.addEventListener('click', () => { delayNumber.value = btn.dataset.delay; });
});

function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  files.forEach(file => {
    const url = URL.createObjectURL(file);
    const imgEl = new Image();
    imgEl.src = url;
    images.push({ file, url, imgEl });
  });
  renderThumbs();
}

function renderThumbs() {
  thumbsEl.innerHTML = '';
  images.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `
      <span class="idx">${i + 1}</span>
      <img src="${item.url}">
      <div class="ctrl">
        <button data-act="left" data-i="${i}">&larr;</button>
        <button data-act="remove" class="remove" data-i="${i}">✕</button>
        <button data-act="right" data-i="${i}">&rarr;</button>
      </div>
    `;
    thumbsEl.appendChild(div);
  });
  generateBtn.disabled = images.length < 2;
  statusEl.textContent = images.length
    ? `${images.length} image${images.length > 1 ? 's' : ''} loaded.`
    : '';
}

thumbsEl.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const i = parseInt(btn.dataset.i, 10);
  const act = btn.dataset.act;
  if (act === 'remove') {
    URL.revokeObjectURL(images[i].url);
    images.splice(i, 1);
  } else if (act === 'left' && i > 0) {
    [images[i - 1], images[i]] = [images[i], images[i - 1]];
  } else if (act === 'right' && i < images.length - 1) {
    [images[i + 1], images[i]] = [images[i], images[i + 1]];
  }
  renderThumbs();
});

clearBtn.addEventListener('click', () => {
  images.forEach(item => URL.revokeObjectURL(item.url));
  images = [];
  renderThumbs();
  resultPanel.style.display = 'none';
});

async function waitForLoad(imgEl) {
  if (imgEl.complete && imgEl.naturalWidth) return;
  await new Promise(resolve => { imgEl.onload = resolve; imgEl.onerror = resolve; });
}

generateBtn.addEventListener('click', async () => {
  if (images.length < 2) return;
  generateBtn.disabled = true;
  clearBtn.disabled = true;
  statusEl.textContent = 'Preparing frames...';
  progressRow.style.display = 'flex';
  progressBar.value = 0;
  progressPct.textContent = '0%';
  resultPanel.style.display = 'none';

  for (const item of images) await waitForLoad(item.imgEl);

  const customWidth = parseInt(widthInput.value, 10);
  const baseW = customWidth > 0 ? customWidth : images[0].imgEl.naturalWidth;
  const baseH = customWidth > 0
    ? Math.round(images[0].imgEl.naturalHeight * (customWidth / images[0].imgEl.naturalWidth))
    : images[0].imgEl.naturalHeight;

  const canvas = document.createElement('canvas');
  canvas.width = baseW;
  canvas.height = baseH;
  const ctx = canvas.getContext('2d');

  let workerBlobUrl;
  try {
    const workerResp = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
    const workerCode = await workerResp.text();
    workerBlobUrl = URL.createObjectURL(new Blob([workerCode], { type: 'application/javascript' }));
  } catch (err) {
    statusEl.textContent = 'Could not load the GIF encoder worker. Check your connection and try again.';
    progressRow.style.display = 'none';
    generateBtn.disabled = false;
    clearBtn.disabled = false;
    return;
  }

  const gif = new GIF({
    workers: 2,
    quality: 10,
    width: baseW,
    height: baseH,
    workerScript: workerBlobUrl,
    repeat: parseInt(loopSelect.value, 10) === 1 ? 1 : 0
  });

  const delayMs = Math.max(10, Math.round(parseFloat(delayNumber.value) * 1000)) || 500;

  images.forEach(item => {
    ctx.clearRect(0, 0, baseW, baseH);
    // fit-cover into base canvas size
    const iw = item.imgEl.naturalWidth, ih = item.imgEl.naturalHeight;
    const scale = Math.max(baseW / iw, baseH / ih);
    const sw = iw * scale, sh = ih * scale;
    const sx = (baseW - sw) / 2, sy = (baseH - sh) / 2;
    ctx.drawImage(item.imgEl, sx, sy, sw, sh);
    gif.addFrame(ctx, { copy: true, delay: delayMs });
  });

  gif.on('progress', p => {
    progressBar.value = p;
    progressPct.textContent = Math.round(p * 100) + '%';
  });
  gif.on('finished', blob => {
    URL.revokeObjectURL(workerBlobUrl);
    const url = URL.createObjectURL(blob);
    resultImg.src = url;
    downloadBtn.href = url;
    resultPanel.style.display = 'block';
    statusEl.textContent = 'Done! GIF generated below.';
    progressRow.style.display = 'none';
    generateBtn.disabled = false;
    clearBtn.disabled = false;
  });
  gif.on('abort', () => {
    statusEl.textContent = 'Encoding was aborted.';
    progressRow.style.display = 'none';
    generateBtn.disabled = false;
    clearBtn.disabled = false;
  });

  statusEl.textContent = 'Encoding GIF... this can take a moment for many/large images.';
  gif.render();
});
</script>

</body>
</html>
