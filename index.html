<!DOCTYPE html>
<html lang="en">
<head>
    <title>Interactive Button and Image Layout</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/xp.css"
    >
    <style>
        /* Modern reset and font setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            padding: 40px 20px;
        }

        /* Container that holds the two columns */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            gap: 40px; /* Space between text and images */
            align-items: flex-start; /* Aligns content to the top */
        }

        /* Left side: Text content and button list */
        .text-column {
            flex: 1; /* Takes up 50% width */
        }
        .text-column h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #111;
        }
        .text-column p {
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        /* Button list container */
        .button-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            list-style: none;
        }



        }

        /* Right side: Image display window */
        .image-column {
            flex: 1; /* Takes up 50% width */
            position: relative;
            height: 400px;
        }
        
        /* Image presentation layout */
        .image-column img {
            width: 450px;
            height: 100%;
            object-fit: cover; /* Prevents image distortion */
            display: none; /* Hide all images by default */
        }

        /* Style for the currently active visible image */
        .image-column img.active {
            display: block;

        }

        /* Responsive Design: Stacks columns on mobile screens */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .text-column, .image-column {
                width: 100%;
            }
            .image-column {
                height: 300px;
            }
            .image-column img {
                height: 300px;
            }
        }


        /* Tabs window holding grouped links, sits where the old button list was */
        .tabs-section {
            width: 100%;
        }
        .tab-strip {
            display: flex;
            gap: 4px;
            list-style: none;
            border-bottom: 2px solid #999;
        }
        .tab-strip li {
            margin-bottom: -2px;
        }
        .tab-btn {
            padding: 8px 18px;
            cursor: pointer;
        }
        .tab-btn.active {
            border-bottom: 2px solid #fff;
            background: #ece9d8;
        }
        .tab-panel {
            display: none;
            padding: 20px;
            border: 1px solid #999;
            border-top: none;
        }
        .tab-panel.active {
            display: block;
        }
        .tab-panel ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Buttons on the left, description text to their right */
        .tools-row {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }
        .tools-row .button-list {
            flex: 0 0 auto;
        }
        .tools-row p {
            flex: 1;
            font-size: 1.1rem;
        }
        @media (max-width: 768px) {
            .tools-row {
                flex-direction: column;
            }
        }
    </style>
</head>

    <!-- Active Swapping Tab Logic Script -->
    <script>
        const buttons = document.querySelectorAll('.nav-btn');
        const images = document.querySelectorAll('.image-column img');

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove the highlighted styling from all other buttons
                buttons.forEach(b => b.classList.remove('active'));
                
                // Hide all standard display images
                images.forEach(img => img.classList.remove('active'));

                // Add active visual state to the clicked button
                btn.classList.add('active');

                // Read custom target key and unlock matching image by ID
                const targetId = btn.getAttribute('data-target');
                const targetImage = document.getElementById(targetId);
                if (targetImage) {
                    targetImage.classList.add('active');
                }
            });
        }); 
    </script>

    <script>
        // Logic for the new link tabs
        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabPanels = document.querySelectorAll('.tab-panel');

        tabButtons.forEach(tabBtn => {
            tabBtn.addEventListener('click', () => {
                tabButtons.forEach(b => b.classList.remove('active'));
                tabPanels.forEach(p => p.classList.remove('active'));

                tabBtn.classList.add('active');
                document.getElementById(tabBtn.getAttribute('data-tab')).classList.add('active');
            });
        });
    </script>
